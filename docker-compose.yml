# Dependências de desenvolvimento. Uso: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: botsaas
      POSTGRES_PASSWORD: botsaas
      POSTGRES_DB: botsaas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botsaas']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
